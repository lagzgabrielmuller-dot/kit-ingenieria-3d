name: Validar el kit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyYAML (para leer el frontmatter igual que un lector estricto)
        run: pip install pyyaml
      - name: Marketplace, plugins y skills
        run: python scripts/validar_kit.py --conteo
      - name: Los demos de los scripts propios andan
        run: |
          set -e
          cd /tmp
          for s in maquinas-electricas/scripts/maquinas.py ensayos-materiales/scripts/ensayos.py \
                   neumatica-electroneumatica/scripts/neumatica.py cnc-mecanizado/scripts/cnc.py \
                   revision-tecnica/scripts/verificar_numeros.py revision-tecnica/scripts/revisar_documento.py; do
            echo "== $s"
            python -I "$GITHUB_WORKSPACE/plugins/ingenieria-3d/skills/$s" demo > /dev/null
          done
          echo "== simulador-educativo/scripts/validar_modelo_kloss.py"
          python -I "$GITHUB_WORKSPACE/plugins/ingenieria-3d/skills/simulador-educativo/scripts/validar_modelo_kloss.py" /tmp/casos.json > /dev/null
